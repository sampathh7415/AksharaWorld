<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sam — AI Agent Dashboard</title>
  <meta name="description" content="Sam local AI agent control dashboard" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens ─────────────────────────────────────────────────── */
    :root {
      --bg:          #020812;
      --bg2:         #060f1e;
      --surface:     rgba(0,200,255,0.04);
      --border:      rgba(0,200,255,0.15);
      --primary:     #00c8ff;
      --primary-dim: rgba(0,200,255,0.15);
      --success:     #00ff9d;
      --warn:        #ffaa00;
      --danger:      #ff3366;
      --text:        #c8e8ff;
      --text-dim:    #5a8aaa;
      --font-hud:    'Orbitron', monospace;
      --font-body:   'Inter', sans-serif;
      --glow:        0 0 20px rgba(0,200,255,0.3);
      --glow-sm:     0 0 8px rgba(0,200,255,0.2);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(0,80,160,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(0,200,255,0.06) 0%, transparent 60%);
    }

    /* ── Grid lines scanline effect ─────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    #app { position: relative; z-index: 1; display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,200,255,0.03);
      backdrop-filter: blur(8px);
    }

    .logo {
      font-family: var(--font-hud);
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--primary);
      text-shadow: var(--glow);
      letter-spacing: 0.15em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-ring {
      width: 32px; height: 32px;
      border: 2px solid var(--primary);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: pulse-ring 2s ease-in-out infinite;
      box-shadow: var(--glow);
    }
    @keyframes pulse-ring {
      0%,100% { transform: scale(1); box-shadow: 0 0 8px rgba(0,200,255,0.3); }
      50%      { transform: scale(1.08); box-shadow: 0 0 20px rgba(0,200,255,0.6); }
    }

    .header-status {
      display: flex; align-items: center; gap: 16px;
      font-size: 0.75rem; font-family: var(--font-hud); letter-spacing: 0.08em;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: blink 2s step-start infinite;
    }
    .status-dot.offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: none; }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

    .kill-btn {
      background: rgba(255,51,102,0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: var(--font-hud);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .kill-btn:hover { background: rgba(255,51,102,0.25); box-shadow: 0 0 12px rgba(255,51,102,0.4); }

    /* ── Main grid ───────────────────────────────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: 1fr 340px;
      grid-template-rows: auto 1fr;
      gap: 1px;
      background: var(--border);
    }

    .panel {
      background: var(--bg2);
      padding: 20px;
    }

    /* ── Stats row ───────────────────────────────────────────────────────── */
    .stats-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1px;
      background: var(--border);
    }
    .stat-card {
      background: var(--bg2);
      padding: 16px 20px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-label { font-family: var(--font-hud); font-size: 0.6rem; letter-spacing: 0.12em; color: var(--text-dim); text-transform: uppercase; }
    .stat-value { font-family: var(--font-hud); font-size: 1.3rem; font-weight: 700; color: var(--primary); text-shadow: var(--glow-sm); }
    .stat-value.ok    { color: var(--success); text-shadow: 0 0 8px var(--success); }
    .stat-value.warn  { color: var(--warn);    text-shadow: 0 0 8px var(--warn);    }
    .stat-value.error { color: var(--danger);  text-shadow: 0 0 8px var(--danger);  }

    /* ── Chat panel ──────────────────────────────────────────────────────── */
    #chat-panel {
      display: flex; flex-direction: column; height: 100%;
    }
    .panel-title {
      font-family: var(--font-hud);
      font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--primary); margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
      padding-right: 8px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message {
      display: flex; gap: 10px; animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(8px) }
      to   { opacity:1; transform: translateY(0) }
    }
    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-family: var(--font-hud);
      flex-shrink: 0;
    }
    .msg-avatar.sam  { background: var(--primary-dim); border: 1px solid var(--primary); color: var(--primary); }
    .msg-avatar.user { background: rgba(0,255,157,0.1); border: 1px solid var(--success); color: var(--success); }

    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.sam  .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 2px 8px 8px 8px; }
    .message.user .msg-bubble { background: rgba(0,200,255,0.08); border: 1px solid rgba(0,200,255,0.2); border-radius: 8px 2px 8px 8px; }

    .msg-time { font-size: 0.65rem; color: var(--text-dim); font-family: var(--font-hud); margin-top: 4px; }

    /* Tool execution indicator */
    .tool-indicator {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-hud); font-size: 0.65rem;
      letter-spacing: 0.08em; color: var(--warn);
      padding: 6px 14px;
      background: rgba(255,170,0,0.06);
      border: 1px solid rgba(255,170,0,0.2);
      border-radius: 4px;
      animation: fadeUp 0.3s ease;
    }
    .tool-spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,170,0,0.3);
      border-top-color: var(--warn);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg) } }

    /* ── Input row ───────────────────────────────────────────────────────── */
    .input-row {
      display: flex; gap: 8px; margin-top: 16px; align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }
    #chat-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,200,255,0.1); }
    #chat-input::placeholder { color: var(--text-dim); }

    .send-btn, .mic-btn {
      width: 44px; height: 44px;
      border-radius: 6px; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; transition: all 0.2s;
      flex-shrink: 0;
    }
    .send-btn {
      background: var(--primary);
      color: var(--bg);
    }
    .send-btn:hover { background: #33d4ff; box-shadow: var(--glow); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .mic-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .mic-btn:hover { border-color: var(--primary); color: var(--primary); }
    .mic-btn.listening {
      background: rgba(255,51,102,0.1);
      border-color: var(--danger);
      color: var(--danger);
      animation: pulse-mic 1s ease-in-out infinite;
    }
    @keyframes pulse-mic { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 16px rgba(255,51,102,0.5)} }

    /* ── Side panel ──────────────────────────────────────────────────────── */
    #side-panel { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
    .side-section { background: var(--bg2); padding: 16px 20px; }

    /* Task list */
    #task-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
    .task-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; padding: 6px 10px;
      border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface);
    }
    .task-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
    .task-status.pending     { background: var(--warn);    box-shadow: 0 0 6px var(--warn);    }
    .task-status.in_progress { background: var(--primary); box-shadow: 0 0 6px var(--primary); animation: blink 1s step-start infinite; }
    .task-status.done        { background: var(--success); }
    .task-status.failed      { background: var(--danger);  }

    .task-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .task-time { font-size: 0.65rem; color: var(--text-dim); font-family: var(--font-hud); }

    /* Audit log */
    #audit-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
    .audit-item {
      font-size: 0.72rem; padding: 4px 8px; border-radius: 3px;
      display: flex; align-items: center; gap: 6px;
      border-left: 2px solid;
    }
    .audit-item.ok { border-color: var(--success); background: rgba(0,255,157,0.04); }
    .audit-item.fail { border-color: var(--danger); background: rgba(255,51,102,0.04); }
    .audit-tool { color: var(--primary); font-family: var(--font-hud); font-size: 0.65rem; }
    .audit-time { color: var(--text-dim); font-family: var(--font-hud); font-size: 0.6rem; margin-left: auto; }

    /* ── Voice transcript ────────────────────────────────────────────────── */
    #voice-transcript {
      font-family: var(--font-hud);
      font-size: 0.7rem;
      color: var(--text-dim);
      min-height: 24px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      letter-spacing: 0.05em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #voice-transcript.active { color: var(--warn); border-color: rgba(255,170,0,0.3); }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    footer {
      padding: 8px 24px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 20px;
      font-family: var(--font-hud); font-size: 0.6rem;
      letter-spacing: 0.1em; color: var(--text-dim);
    }
    footer span { display: flex; align-items: center; gap: 6px; }
    #conn-status { color: var(--success); }
    #conn-status.offline { color: var(--danger); }

    /* ── Notification toast ──────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 80px; right: 24px;
      background: var(--bg2); border: 1px solid var(--primary);
      padding: 12px 20px; border-radius: 6px;
      font-size: 0.82rem; max-width: 320px;
      box-shadow: var(--glow); z-index: 100;
      transform: translateY(20px); opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    /* ── Approval modal ──────────────────────────────────────────────────── */
    #approval-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(2,8,18,0.85); backdrop-filter: blur(6px);
      z-index: 200; align-items: center; justify-content: center;
    }
    #approval-modal.show { display: flex; }
    .approval-box {
      background: var(--bg2);
      border: 1px solid var(--warn);
      border-radius: 8px;
      padding: 28px 32px;
      max-width: 460px; width: 90%;
      box-shadow: 0 0 40px rgba(255,170,0,0.2);
    }
    .approval-title { font-family: var(--font-hud); color: var(--warn); font-size: 0.9rem; margin-bottom: 12px; letter-spacing: 0.1em; }
    .approval-detail { font-size: 0.82rem; color: var(--text); margin-bottom: 20px; line-height: 1.6; }
    .approval-detail code { background: rgba(0,200,255,0.08); padding: 2px 6px; border-radius: 3px; font-family: monospace; }
    .approval-btns { display: flex; gap: 12px; }
    .approval-btn {
      flex: 1; padding: 10px; border: none; border-radius: 6px;
      font-family: var(--font-hud); font-size: 0.75rem; letter-spacing: 0.08em;
      cursor: pointer; transition: all 0.2s;
    }
    .approval-btn.yes { background: var(--success); color: var(--bg); }
    .approval-btn.yes:hover { box-shadow: 0 0 16px rgba(0,255,157,0.5); }
    .approval-btn.no  { background: rgba(255,51,102,0.15); border: 1px solid var(--danger); color: var(--danger); }
    .approval-btn.no:hover { background: rgba(255,51,102,0.3); }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
      #side-panel { display: none; }
      .logo { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-ring">◈</div>
      SAM
    </div>
    <div class="header-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-label" style="font-size:0.7rem;letter-spacing:0.08em">ONLINE</span>
      <span id="cpu-display">CPU: --</span>
      <span id="ram-display">RAM: --</span>
    </div>
    <button class="kill-btn" id="kill-btn" title="Emergency shutdown">⬛ KILL</button>
  </header>

  <main>
    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-label">Status</span>
        <span class="stat-value ok" id="stat-status">ONLINE</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending Tasks</span>
        <span class="stat-value" id="stat-pending">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Memories</span>
        <span class="stat-value" id="stat-memories">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">GPU</span>
        <span class="stat-value" id="stat-gpu" style="font-size:0.75rem">—</span>
      </div>
    </div>

    <!-- Chat -->
    <div class="panel" id="chat-panel">
      <div class="panel-title">🤖 Sam Interface</div>
      <div id="messages"></div>
      <div id="tool-indicator" class="tool-indicator" style="display:none">
        <div class="tool-spinner"></div>
        <span id="tool-name">executing…</span>
      </div>
      <div class="input-row">
        <button class="mic-btn" id="mic-btn" title="Push to talk (hold Space)">🎤</button>
        <textarea id="chat-input" rows="1" placeholder="Ask Sam anything…"></textarea>
        <button class="send-btn" id="send-btn" title="Send (Enter)">➤</button>
      </div>
      <div id="voice-transcript">— voice transcript —</div>
    </div>

    <!-- Side panel -->
    <div id="side-panel">
      <!-- Tasks -->
      <div class="side-section">
        <div class="panel-title">📋 Task Queue</div>
        <div id="task-list"><div style="color:var(--text-dim);font-size:0.78rem">No tasks yet.</div></div>
      </div>
      <!-- Audit log -->
      <div class="side-section" style="flex:1">
        <div class="panel-title">📊 Recent Actions</div>
        <div id="audit-list"><div style="color:var(--text-dim);font-size:0.72rem">No actions yet.</div></div>
      </div>
    </div>
  </main>

  <footer>
    <span>SAM v1.0</span>
    <span id="conn-status" class="offline">WS: CONNECTING…</span>
    <span id="model-display">MODEL: —</span>
    <span style="margin-left:auto" id="clock">—</span>
  </footer>
</div>

<!-- Approval modal -->
<div id="approval-modal">
  <div class="approval-box">
    <div class="approval-title" id="approval-title">⚠️ ACTION APPROVAL REQUIRED</div>
    <div class="approval-detail" id="approval-detail">Sam wants to perform an action.</div>
    <div class="approval-btns">
      <button class="approval-btn yes" id="approval-yes">✅ APPROVE</button>
      <button class="approval-btn no"  id="approval-no">❌ REJECT</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

// ── Config ────────────────────────────────────────────────────────────────────
const SAM_API = window.location.origin;
const SAM_WS  = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}/ws/chat`;
const SECRET  = localStorage.getItem('sam_secret') || '';

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws = null;
let wsReconnectTimer = null;
let sessionId = `web_${Date.now()}`;

function connectWS() {
  ws = new WebSocket(SAM_WS);
  ws.onopen = () => {
    document.getElementById('conn-status').textContent = 'WS: CONNECTED';
    document.getElementById('conn-status').classList.remove('offline');
  };
  ws.onmessage = (evt) => {
    const data = JSON.parse(evt.data);
    handleWsMessage(data);
  };
  ws.onclose = () => {
    document.getElementById('conn-status').textContent = 'WS: RECONNECTING…';
    document.getElementById('conn-status').classList.add('offline');
    wsReconnectTimer = setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

// Current streaming message bubble
let streamBubble = null;
let streamContent = '';

function handleWsMessage(data) {
  if (data.type === 'token') {
    if (!streamBubble) {
      streamBubble = addMessage('sam', '', false);
    }
    streamContent += data.content;
    streamBubble.querySelector('.msg-bubble').textContent = streamContent;
    document.getElementById('messages').scrollTop = 99999;
  } else if (data.type === 'done') {
    streamBubble = null; streamContent = '';
    hideSending();
    document.getElementById('send-btn').disabled = false;
  } else if (data.type === 'error') {
    hideSending();
    document.getElementById('send-btn').disabled = false;
    addMessage('sam', `⚠️ ${data.content}`);
  } else if (data.type === 'tool_start') {
    showToolIndicator(data.tool_name);
  } else if (data.type === 'tool_end') {
    hideToolIndicator();
  } else if (data.type === 'approval') {
    showApprovalModal(data);
  }
}

// ── Messaging ─────────────────────────────────────────────────────────────────
function addMessage(role, text, scroll = true) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${role}`;
  const now = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  msgDiv.innerHTML = `
    <div class="msg-avatar ${role}">${role === 'sam' ? 'S' : 'U'}</div>
    <div>
      <div class="msg-bubble">${text}</div>
      <div class="msg-time">${now}</div>
    </div>`;
  document.getElementById('messages').appendChild(msgDiv);
  if (scroll) document.getElementById('messages').scrollTop = 99999;
  return msgDiv;
}

function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  addMessage('user', text);
  input.value = ''; input.style.height = '';
  document.getElementById('send-btn').disabled = true;

  ws.send(JSON.stringify({ message: text, session_id: sessionId }));
}

// ── Tool indicator ────────────────────────────────────────────────────────────
function showToolIndicator(name) {
  document.getElementById('tool-indicator').style.display = 'flex';
  document.getElementById('tool-name').textContent = `Executing: ${name}`;
}
function hideToolIndicator() {
  document.getElementById('tool-indicator').style.display = 'none';
}
function hideSending() { hideToolIndicator(); }

// ── Approval modal ────────────────────────────────────────────────────────────
let approvalResolve = null;

function showApprovalModal(data) {
  document.getElementById('approval-title').textContent =
    `${data.risk === 'HIGH' ? '🚨' : '⚠️'} ${data.risk} RISK — APPROVAL REQUIRED`;
  document.getElementById('approval-detail').innerHTML =
    `Tool: <code>${data.tool_name}</code><br>Input: <code>${JSON.stringify(data.input).slice(0, 200)}</code>`;
  document.getElementById('approval-modal').classList.add('show');
}

document.getElementById('approval-yes').onclick = () => {
  document.getElementById('approval-modal').classList.remove('show');
  if (approvalResolve) approvalResolve(true);
};
document.getElementById('approval-no').onclick = () => {
  document.getElementById('approval-modal').classList.remove('show');
  if (approvalResolve) approvalResolve(false);
};

// ── Status polling ────────────────────────────────────────────────────────────
async function pollStatus() {
  try {
    const r = await fetch(`${SAM_API}/api/status`, {
      headers: SECRET ? { Authorization: `Bearer ${SECRET}` } : {}
    });
    if (!r.ok) return;
    const d = await r.json();

    const dot = document.getElementById('status-dot');
    const lbl = document.getElementById('status-label');
    const statStatus = document.getElementById('stat-status');

    if (d.shutdown) {
      dot.classList.add('offline');
      lbl.textContent = 'SHUTDOWN';
      statStatus.textContent = 'SHUTDOWN'; statStatus.className = 'stat-value error';
    } else if (d.locked) {
      lbl.textContent = 'LOCKED';
      statStatus.textContent = 'LOCKED'; statStatus.className = 'stat-value warn';
    } else {
      dot.classList.remove('offline');
      lbl.textContent = 'ONLINE';
      statStatus.textContent = 'ONLINE'; statStatus.className = 'stat-value ok';
    }

    document.getElementById('stat-pending').textContent = d.queue?.pending ?? 0;
    document.getElementById('cpu-display').textContent = `CPU: ${d.cpu_percent?.toFixed(0)}%`;
    document.getElementById('ram-display').textContent = `RAM: ${d.ram_percent?.toFixed(0)}%`;
    document.getElementById('stat-gpu').textContent = d.gpu || '—';
  } catch (e) {
    document.getElementById('status-dot').classList.add('offline');
    document.getElementById('status-label').textContent = 'OFFLINE';
  }
}

async function pollMemoryStats() {
  try {
    const r = await fetch(`${SAM_API}/api/memory/stats`, {
      headers: SECRET ? { Authorization: `Bearer ${SECRET}` } : {}
    });
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('stat-memories').textContent = d.memories ?? '—';
  } catch {}
}

async function pollTasks() {
  try {
    const r = await fetch(`${SAM_API}/api/tasks`, {
      headers: SECRET ? { Authorization: `Bearer ${SECRET}` } : {}
    });
    if (!r.ok) return;
    const d = await r.json();
    const list = document.getElementById('task-list');
    if (!d.tasks?.length) {
      list.innerHTML = '<div style="color:var(--text-dim);font-size:0.78rem">No tasks.</div>';
      return;
    }
    list.innerHTML = d.tasks.slice(0, 8).map(t => `
      <div class="task-item">
        <div class="task-status ${t.status}"></div>
        <div class="task-text">${t.command.slice(0, 50)}</div>
        <div class="task-time">${t.created_at?.slice(11,16)}</div>
      </div>`).join('');
  } catch {}
}

async function pollLogs() {
  try {
    const r = await fetch(`${SAM_API}/api/logs?n=8`, {
      headers: SECRET ? { Authorization: `Bearer ${SECRET}` } : {}
    });
    if (!r.ok) return;
    const d = await r.json();
    const list = document.getElementById('audit-list');
    if (!d.logs?.length) {
      list.innerHTML = '<div style="color:var(--text-dim);font-size:0.72rem">No actions yet.</div>';
      return;
    }
    list.innerHTML = d.logs.map(l => `
      <div class="audit-item ${l.success ? 'ok' : 'fail'}">
        <span class="audit-tool">${l.tool_name}</span>
        <span style="color:var(--text-dim);font-size:0.65rem">[${l.approval_status}]</span>
        <span class="audit-time">${l.timestamp?.slice(11,16)}</span>
      </div>`).join('');
  } catch {}
}

// ── Voice (Web Speech API fallback) ──────────────────────────────────────────
let recognition = null;
const micBtn = document.getElementById('mic-btn');

if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.lang = 'en-US';
  recognition.interimResults = true;

  recognition.onresult = (evt) => {
    const transcript = Array.from(evt.results).map(r => r[0].transcript).join('');
    document.getElementById('voice-transcript').textContent = transcript;
    document.getElementById('voice-transcript').classList.add('active');
    if (evt.results[0].isFinal) {
      document.getElementById('chat-input').value = transcript;
      document.getElementById('voice-transcript').classList.remove('active');
      micBtn.classList.remove('listening');
    }
  };
  recognition.onend = () => micBtn.classList.remove('listening');
} else {
  micBtn.title = 'Voice not supported in this browser';
}

micBtn.addEventListener('click', () => {
  if (!recognition) return;
  if (micBtn.classList.contains('listening')) {
    recognition.stop();
    micBtn.classList.remove('listening');
  } else {
    recognition.start();
    micBtn.classList.add('listening');
    document.getElementById('voice-transcript').textContent = '🎤 Listening…';
  }
});

// Space = push-to-talk (when not typing)
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && document.activeElement !== document.getElementById('chat-input')) {
    e.preventDefault();
    if (recognition && !micBtn.classList.contains('listening')) {
      recognition.start();
      micBtn.classList.add('listening');
      document.getElementById('voice-transcript').textContent = '🎤 Listening…';
    }
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && micBtn.classList.contains('listening')) {
    recognition?.stop();
  }
});

// ── Kill switch ───────────────────────────────────────────────────────────────
document.getElementById('kill-btn').addEventListener('click', async () => {
  if (!confirm('⛔ Activate EMERGENCY SHUTDOWN? Sam will stop all actions.')) return;
  await fetch(`${SAM_API}/api/shutdown`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(SECRET ? { Authorization: `Bearer ${SECRET}` } : {}) }
  });
  showToast('🛑 Emergency shutdown activated.');
});

// ── Input handlers ────────────────────────────────────────────────────────────
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('chat-input').addEventListener('input', function () {
  this.style.height = '';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, duration = 4000) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration);
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-IN', { hour12: false });
}
updateClock();
setInterval(updateClock, 1000);

// ── Boot ──────────────────────────────────────────────────────────────────────
connectWS();
addMessage('sam', '🤖 Sam is online. How can I help you?');

pollStatus();
pollMemoryStats();
pollTasks();
pollLogs();
setInterval(pollStatus, 5000);
setInterval(pollMemoryStats, 30000);
setInterval(pollTasks, 3000);
setInterval(pollLogs, 5000);
</script>
