name: Deploy Dashboards
on:
  push:
    branches: [main, master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm ci --legacy-peer-deps
      - run: cd . && npm run build
      - run: cd akshara-world-dashboard || true && npm run build || true
      - name: Deploy to Cloudflare Pages (Dashboard)
        run: |
          cd .
          npm run build
          # Add Cloudflare deployment here
      - name: Deploy to Vercel (Akshara Dashboard)
        run: |
          cd akshara-world-dashboard || true
          npm run build
          # Add Vercel deployment here
