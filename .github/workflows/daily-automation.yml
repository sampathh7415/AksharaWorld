name: SAM Daily Automation

on:
  schedule:
    # 6 AM IST = 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (full / metrics-only / notify-only)'
        required: false
        default: 'full'

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── Telegram: Start notification ──────────────────────────────────────
      - name: Notify Telegram — Automation Start
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          if [ -z "${{ secrets.TELEGRAM_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Telegram secrets not set — skipping"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.TELEGRAM_CHAT_ID }}\",\"text\":\"🤖 SAM Daily Automation started!\nDate: $DATE\nRepo: sampathh7415/AksharaWorld\nSite: aksharaworld.in\"}"
        continue-on-error: true

      # ── Razorpay API Health Check ─────────────────────────────────────────
      - name: Razorpay API Health Check
        id: razorpay_check
        run: |
          if [ -z "${{ secrets.RAZORPAY_KEY_ID }}" ] || [ -z "${{ secrets.RAZORPAY_KEY_SECRET }}" ]; then
            echo "razorpay_status=SECRETS_MISSING" >> $GITHUB_OUTPUT
            echo "Razorpay secrets not configured — skipping"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.RAZORPAY_KEY_ID }}:${{ secrets.RAZORPAY_KEY_SECRET }}" \
            "https://api.razorpay.com/v1/payments?count=1")
          echo "razorpay_status=$STATUS" >> $GITHUB_OUTPUT
          echo "Razorpay API status: $STATUS"
        continue-on-error: true

      # ── Website Health Check ──────────────────────────────────────────────
      - name: Website Health Check
        id: site_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://aksharaworld.in/public" || echo "000")
          echo "site_status=$STATUS" >> $GITHUB_OUTPUT
          echo "aksharaworld.in/public HTTP status: $STATUS"
          
          PRODUCT=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://aksharaworld.in/public/products/ai-blueprint" || echo "000")
          echo "product_status=$PRODUCT" >> $GITHUB_OUTPUT
          echo "AI Blueprint product HTTP status: $PRODUCT"
        continue-on-error: true

      # ── Google Sheets: Log daily run via Apps Script Webhook ──────────────
      - name: Log to Google Sheets
        run: |
          WEBHOOK="${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}"
          if [ -z "$WEBHOOK" ]; then
            echo "Apps Script Webhook URL not set — skipping Google Sheets log"
            exit 0
          fi
          DATE=$(date '+%Y-%m-%d')
          TIME=$(date '+%H:%M:%S')
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"addLog\",\"data\":{\"timestamp\":\"$DATE $TIME\",\"department\":\"Tech_Core\",\"message\":\"GitHub Actions: SAM Daily Run completed successfully\",\"status\":\"info\"}}"
          echo "✅ Logged run to Google Sheets via Webhook"
        continue-on-error: true

      # ── GA4 Metrics ───────────────────────────────────────────────────────
      - name: Pull GA4 Metrics
        run: |
          GA4_ID="${{ secrets.GA4_PROPERTY_ID }}"
          GA4_TOKEN="${{ secrets.GA4_ACCESS_TOKEN }}"
          if [ -z "$GA4_ID" ] || [ -z "$GA4_TOKEN" ]; then
            echo "GA4 secrets not set — skipping"
            exit 0
          fi
          curl -s -X POST \
            "https://analyticsdata.googleapis.com/v1beta/properties/$GA4_ID:runReport" \
            -H "Authorization: Bearer $GA4_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"dateRanges":[{"startDate":"yesterday","endDate":"yesterday"}],"metrics":[{"name":"activeUsers"},{"name":"sessions"}]}'
          echo "GA4 metrics pulled"
        continue-on-error: true

      # ── Brevo Email Stats ─────────────────────────────────────────────────
      - name: Pull Brevo Email Statistics
        run: |
          BREVO_KEY="${{ secrets.BREVO_API_KEY }}"
          if [ -z "$BREVO_KEY" ]; then
            echo "Brevo API key not set — skipping"
            exit 0
          fi
          RESULT=$(curl -s -X GET "https://api.brevo.com/v3/emailCampaigns?status=sent&limit=5" \
            -H "api-key: $BREVO_KEY" \
            -H "Accept: application/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Campaigns: {len(d.get(\"campaigns\",[]))}')" 2>/dev/null || echo "Brevo check complete")
          echo "$RESULT"
        continue-on-error: true

      # ── Telegram: Final Daily Report ──────────────────────────────────────
      - name: Notify Telegram — Daily Report
        run: |
          if [ -z "${{ secrets.TELEGRAM_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Telegram secrets not set — skipping"
            exit 0
          fi
          DATE=$(date '+%Y-%m-%d')
          RAZORPAY="${{ steps.razorpay_check.outputs.razorpay_status }}"
          SITE="${{ steps.site_check.outputs.site_status }}"

          if [ "$RAZORPAY" = "200" ]; then RZ_STATUS="✅ Online"; else RZ_STATUS="⚠️ $RAZORPAY"; fi
          if [ "$SITE" = "200" ]; then SITE_STATUS="✅ Online"; else SITE_STATUS="⚠️ $SITE"; fi

          MSG="📊 SAM Daily Report — $DATE\n\n💳 Razorpay: $RZ_STATUS\n🌐 Website: $SITE_STATUS\n\n🏪 aksharaworld.in/public\n📦 AI Blueprint: aksharaworld.in/public/products/ai-blueprint\n\n⏰ Next run: Tomorrow 6 AM IST"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.TELEGRAM_CHAT_ID }}\",\"text\":\"$MSG\"}"
        continue-on-error: true

      # ── Final Summary ─────────────────────────────────────────────────────
      - name: Print Summary
        run: |
          echo "========================================"
          echo "✅ SAM Daily Automation Complete"
          echo "Date: $(date '+%Y-%m-%d %H:%M UTC')"
          echo "Repo: sampathh7415/AksharaWorld"
          echo "Site: aksharaworld.in"
          echo "Razorpay: ${{ steps.razorpay_check.outputs.razorpay_status }}"
          echo "Website:  ${{ steps.site_check.outputs.site_status }}"
          echo "========================================"
