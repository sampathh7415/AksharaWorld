name: SAM Daily Automation

on:
  schedule:
    # 6 AM IST = 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (full / metrics-only / notify-only)'
        required: false
        default: 'full'

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        continue-on-error: true

      # ── Telegram: Start notification ──────────────────────────────────────
      - name: Notify Telegram — Automation Start
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.TELEGRAM_CHAT_ID }}\",\"text\":\"SAM Daily Automation started! Date: $DATE | Repo: sampathh7415/AksharaWorld\"}"
        continue-on-error: true

      # ── Razorpay Health Check ─────────────────────────────────────────────
      - name: Razorpay API Health Check
        id: razorpay_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.RAZORPAY_KEY_ID }}:${{ secrets.RAZORPAY_KEY_SECRET }}" \
            "https://api.razorpay.com/v1/payments?count=1")
          echo "razorpay_status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "200" ]; then
            echo "Razorpay API: OK ($STATUS)"
          else
            echo "Razorpay API status: $STATUS"
          fi
        continue-on-error: true

      # ── Google Sheets: Log daily run (optional — skips if secret missing) ──
      - name: Log to Google Sheets
        run: |
          SHEET_ID="${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}"
          API_KEY="${{ secrets.GOOGLE_SHEETS_API_KEY }}"
          if [ -z "$SHEET_ID" ] || [ -z "$API_KEY" ]; then
            echo "Google Sheets secrets not set — skipping"
            exit 0
          fi
          DATE=$(date '+%Y-%m-%d')
          TIME=$(date '+%H:%M:%S')
          curl -s -X POST \
            "https://sheets.googleapis.com/v4/spreadsheets/$SHEET_ID/values/Automation!A:E:append?valueInputOption=USER_ENTERED&key=$API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"values\":[[\"$DATE\",\"$TIME\",\"GitHub Actions\",\"SAM Daily Run\",\"success\"]]}"
          echo "Logged to Google Sheets"
        continue-on-error: true

      # ── GA4 Metrics (optional — skips if secret missing) ─────────────────
      - name: Pull GA4 Metrics
        run: |
          GA4_ID="${{ secrets.GA4_PROPERTY_ID }}"
          GA4_TOKEN="${{ secrets.GA4_ACCESS_TOKEN }}"
          if [ -z "$GA4_ID" ] || [ -z "$GA4_TOKEN" ]; then
            echo "GA4 secrets not set — skipping"
            exit 0
          fi
          curl -s -X POST \
            "https://analyticsdata.googleapis.com/v1beta/properties/$GA4_ID:runReport" \
            -H "Authorization: Bearer $GA4_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"dateRanges":[{"startDate":"yesterday","endDate":"yesterday"}],"metrics":[{"name":"activeUsers"},{"name":"sessions"}]}'
          echo "GA4 metrics pulled"
        continue-on-error: true

      # ── Brevo Email Stats (optional — skips if secret missing) ────────────
      - name: Pull Brevo Email Statistics
        run: |
          BREVO_KEY="${{ secrets.BREVO_API_KEY }}"
          if [ -z "$BREVO_KEY" ]; then
            echo "Brevo API key not set — skipping"
            exit 0
          fi
          curl -s -X GET "https://api.brevo.com/v3/emailCampaigns?status=sent&limit=5" \
            -H "api-key: $BREVO_KEY" \
            -H "Accept: application/json" | head -c 500
        continue-on-error: true

      # ── Telegram: Final Daily Report ──────────────────────────────────────
      - name: Notify Telegram — Daily Report
        run: |
          DATE=$(date '+%Y-%m-%d')
          RAZORPAY="${{ steps.razorpay_check.outputs.razorpay_status }}"
          if [ "$RAZORPAY" = "200" ]; then
            RZ_STATUS="Online"
          else
            RZ_STATUS="Status: $RAZORPAY"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.TELEGRAM_CHAT_ID }}\",\"text\":\"SAM Daily Report - $DATE | Razorpay: $RZ_STATUS | Site: aksharaworld.in | Product: aksharaworld.in/products/ai-blueprint | Automation complete! Next run: Tomorrow 6 AM IST\"}"
        continue-on-error: true

      # ── Final Summary ─────────────────────────────────────────────────────
      - name: Print Summary
        run: |
          echo "========================================"
          echo "SAM Daily Automation Complete"
          echo "Date: $(date '+%Y-%m-%d %H:%M UTC')"
          echo "Repo: sampathh7415/AksharaWorld"
          echo "Site: aksharaworld.in"
          echo "========================================"
