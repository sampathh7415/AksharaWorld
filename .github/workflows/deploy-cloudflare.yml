name: Deploy Dashboard to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        working-directory: ./
        run: npm ci --legacy-peer-deps

      - name: Build dashboard
        working-directory: ./
        run: npm run build
        env:
          # ── Clerk Auth ──
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /
          # ── Sam Brain ──
          NEXT_PUBLIC_SAM_URL: ${{ secrets.NEXT_PUBLIC_SAM_URL }}
          SAM_BRAIN_URL: ${{ secrets.NEXT_PUBLIC_SAM_URL }}
          # ── Gemini AI ──
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ── Google Analytics GA4 ──
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-QZ4L9XW64F
          # ── Google reCAPTCHA Enterprise ──
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 6Lfv9vYsAAAAAH_t85p2PGbGHD1JsPbA2YyZ2Y85

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .next/standalone --project-name=akshara-dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SAM_URL: ${{ secrets.NEXT_PUBLIC_SAM_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-QZ4L9XW64F
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 6Lfv9vYsAAAAAH_t85p2PGbGHD1JsPbA2YyZ2Y85

      - name: Deployment summary
        run: |
          echo "✅ Dashboard deployed to Cloudflare Pages"
          echo "📍 Custom domain: dash.aksharaworld.in"
          echo "📊 GA4: G-QZ4L9XW64F active"
          echo "🛡️ reCAPTCHA Enterprise: 6Lfv9vYs... active"
