version: '3.8'

services:
  dashboard:
    build:
      context: .
      target: dashboard-builder
    container_name: akshara-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SAM_BRAIN_URL=https://sam-ceo-brain.akshara-sam.workers.dev/api/sam
    volumes:
      - ./dashboard/.next:/app/dashboard/.next
    command: npm start
    restart: unless-stopped
    depends_on:
      - ollama

  akshara-dashboard:
    build:
      context: .
      target: akshara-builder
    container_name: akshara-world-dashboard
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SAM_BRAIN_URL=https://sam-ceo-brain.akshara-sam.workers.dev/api/sam
    volumes:
      - ./akshara-world-dashboard/.next:/app/akshara-world-dashboard/.next
    command: npm start
    restart: unless-stopped
    depends_on:
      - ollama

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: akshara-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
      - akshara-dashboard
      - ollama
    restart: unless-stopped

  # Local AWS Emulation alternative via Floci
  floci:
    image: floci/floci:latest
    container_name: akshara-floci-cloud
    ports:
      - "4566:4566"
    volumes:
      - ./data/floci:/app/data
    restart: unless-stopped

  # Ollama - Local LLM Runtime
  ollama:
    image: ollama/ollama:latest
    container_name: akshara-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    # Uncomment below for GPU support (NVIDIA CUDA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama-storage:
    driver: local
