services:
  - type: web
    name: pixelforge-ai-store
    runtime: node
    plan: free
    buildCommand: echo "No build"
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3847"
      - key: STORE_NAME
        value: PixelForge AI
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
